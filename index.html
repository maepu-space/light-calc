<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光と電気の計算ツール</title><meta name="description" content="植物栽培用LEDの必要な光の量（PPFD・DLI）、消費電力、電気代、温室内の温度上昇を計算するツール">
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--sub:#5f5e5a;--mut:#888780;--bd:rgba(31,30,29,.15);--acc:#185FA5;--accbg:#E6F1FB;--dan:#A32D2D;--ok:#3B6D11;--neu:#f1efe8}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2928;--tx:#ecebe6;--sub:#b4b2a9;--mut:#888780;--bd:rgba(236,235,230,.15);--acc:#85B7EB;--accbg:#0C447C;--dan:#F09595;--ok:#97C459;--neu:#333230}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;font-weight:500;margin:4px 0 2px}
h2{font-size:17px;font-weight:500;margin:28px 0 10px;padding-top:6px;border-top:.5px solid var(--bd)}
h3{font-size:15px;font-weight:500;margin:16px 0 6px}
p{margin:6px 0}
.sub{color:var(--sub);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
nav a{font-size:13px;color:var(--acc);text-decoration:none;border:.5px solid var(--bd);border-radius:8px;padding:4px 10px;background:var(--card)}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg label,.row label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:.5px solid var(--bd);border-radius:8px;padding:7px 9px}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;border:none;background:transparent}
button{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:.5px solid var(--sub);border-radius:8px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.sm{font-size:12px;padding:3px 8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.st{background:var(--neu);border-radius:8px;padding:8px 10px}
.st .l{font-size:12px;color:var(--sub)}.st .v{font-size:18px;font-weight:500}.st .f{font-size:11px;color:var(--mut)}
.err{color:var(--dan);font-size:13px;min-height:1em}
.warn{color:var(--dan)}
.ok{color:var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:.5px solid var(--bd);padding:5px 6px;text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--sub)}
td:first-child,th:first-child{text-align:left}
.rng{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.rng label{font-size:12px;color:var(--sub);min-width:88px}
.rng input{flex:1;min-width:0}
.rng span{font-size:13px;font-weight:500;min-width:76px;text-align:right}
.cw{position:relative;height:240px;margin:8px 0 16px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
#status{font-size:12px;margin-top:4px}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}

.presets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
code{font-family:ui-monospace,monospace;font-size:13px;background:var(--neu);padding:1px 5px;border-radius:4px}
</style></head><body>
<main id="root"></main>
<script>
const $=s=>document.querySelector(s);
function frac(dcm,side,refl){const A=(side/100)**2,r2=A/Math.PI,f0=r2/(r2+(dcm/100)**2);return Math.min(1,f0+(1-f0)*refl/100)}
let h='';
h+='<h1>光と電気の計算ツール</h1><p class="sub">植物を育てるLEDについて、必要な光の量、消費電力、電気代、温室内の温度上昇を計算します。目標PPFDと点灯時間は、育てる植物に合わせて設定してください。設計用の目安です。</p>';
h+='<div class="presets"><span class="sub" style="align-self:center">例：</span><button class="sm" data-pre="open">反射なし・換気なし</button><button class="sm" data-pre="good">反射壁70%・換気100 L/分</button><button class="sm" data-pre="strong">強い光（PPFD 1000・12時間）</button><button class="sm" data-pre="weak">弱い光（PPFD 200・16時間）</button></div>';
  h+='<div class="card" id="calcbox"><canvas id="anim" style="width:100%;height:280px;display:block;border-radius:8px;background:var(--neu)" aria-label="温室の断面アニメーション。LEDから出た光の粒が面に届く様子、壁の反射、換気ファン、温度上昇を表示"></canvas><p class="sub" style="margin:4px 0 10px">緑の面に届いた光の粒が光合成に使われる光。壁や床で消える粒は無駄になる光。</p>';
  const R=(id,l,min,max,st,v)=>'<div class="rng"><label>'+l+'</label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+st+'" value="'+v+'"><span id="'+id+'o"></span></div>';
  h+='<h3>光</h3>'+R('cp','目標PPFD',100,1500,50,1000)+R('ch','点灯時間',6,20,1,12)+R('ca','面積（1辺）',5,40,5,10)+R('cd','LEDとの距離',5,60,1,20)+R('cr','壁の反射率',0,90,5,0)+R('ce','LED効率',1.5,3.5,0.1,2.5);
  h+='<div class="stats"><div class="st"><div class="l">DLI</div><div class="v" id="o-dli"></div><div class="f">PPFD×時間×0.0036</div></div><div class="st"><div class="l">面に届く割合</div><div class="v" id="o-fr"></div><div class="f">距離と反射で決まる</div></div><div class="st"><div class="l">必要なLED出力</div><div class="v" id="o-ppf"></div><div class="f">PPFD×面積÷届く割合</div></div><div class="st"><div class="l">消費電力</div><div class="v" id="o-w"></div><div class="f">LED出力÷LED効率</div></div></div>';
  h+='<h3>電気料金</h3>'+R('cc','電気単価',20,50,1,31)+R('cn','栽培日数',30,120,5,90);
  h+='<div class="stats"><div class="st"><div class="l">1日</div><div class="v" id="o-cd"></div><div class="f" id="o-kwh"></div></div><div class="st"><div class="l">1か月（30日）</div><div class="v" id="o-cm"></div><div class="f">1日×30</div></div><div class="st"><div class="l">栽培1回分</div><div class="v" id="o-cc"></div><div class="f">1日×栽培日数</div></div><div class="st"><div class="l">光1 molあたり</div><div class="v" id="o-cmol"></div><div class="f">1日の電気代÷面に届いた光</div></div></div>';
  h+='<h3>温度上昇（点灯中、室温との差）</h3>'+R('cs','温室1辺',20,60,5,30)+'<div class="rng"><label>壁の材質</label><select id="cu" style="flex:1"><option value="5.5">ガラス・アクリル1枚</option><option value="3">ポリカ中空板</option><option value="1">断熱材（スタイロ）</option></select></div>'+R('cv','換気量',0,300,10,0);
  h+='<div class="stats"><div class="st"><div class="l">気温の上昇</div><div class="v" id="o-dt"></div><div class="f">発熱÷（壁の放熱＋換気）</div></div><div class="st"><div class="l">放熱（壁 / 換気）</div><div class="v" id="o-ua" style="font-size:15px"></div><div class="f">W/℃</div></div></div>';
  h+='<p class="sub">前提：LEDは真下が最も明るい一般的な配光。反射光はすべて面に届く（最良の場合）。消費電力はすべて熱になり、温度が落ち着いた状態。葉の蒸散による冷却は含まない。</p></div>';
h+='<h2>計算式</h2><div class="card"><ul>';
h+='<li><b>DLI</b>（1日の光の量, mol/m²/日）＝ PPFD × 点灯時間 × 3600 ÷ 1,000,000</li>';
h+='<li><b>面に届く割合</b> ＝ r² ÷ (r² ＋ 距離²) ＋ 届かなかった光 × 反射率（r：面積と同じ面積の円の半径）</li>';
h+='<li><b>必要なLED出力</b>（µmol/s）＝ PPFD × 面積(m²) ÷ 面に届く割合</li>';
h+='<li><b>消費電力</b>（W）＝ 必要なLED出力 ÷ LED効率(µmol/J)</li>';
h+='<li><b>電気代</b> ＝ 消費電力 × 点灯時間 ÷ 1000 × 電気単価</li>';
h+='<li><b>温度上昇</b> ＝ 消費電力 ÷（壁の熱の逃げやすさ × 壁の面積 ＋ 1200 × 換気量(m³/s)）</li>';
h+='</ul><p class="sub">PPFDは、1秒間に1m²に届く光の粒の数（µmol/m²/s）。LED効率はデータシートの値（µmol/J）。電気単価の初期値31円/kWhは目安単価なので、契約の単価に合わせてください。</p></div>';
$('#root').innerHTML=h;
function calc(){
  const g=id=>+$('#'+id).value;
  const p=g('cp'),h=g('ch'),s=g('ca'),d=g('cd'),R=g('cr'),e=g('ce'),c=g('cc'),n=g('cn'),cs=g('cs'),U=+$('#cu').value,v=g('cv');
  const set=(id,t)=>{$('#'+id).textContent=t};
  set('cpo',p+' µmol');set('cho',h+' 時間');set('cao',s+' cm');set('cdo',d+' cm');set('cro',R+' %');set('ceo',e.toFixed(1)+' µmol/J');set('cco',c+' 円/kWh');set('cno',n+' 日');set('cso',cs+' cm');set('cvo',v+' L/分');
  const A=(s/100)**2,f=frac(d,s,R),ppf=p*A/f,W=ppf/e,dli=p*h*0.0036,kwh=W*h/1000;
  set('o-dli',dli.toFixed(1)+' mol/m²');set('o-fr',Math.round(f*100)+' %');set('o-ppf',ppf.toFixed(0)+' µmol/s');set('o-w',W.toFixed(1)+' W');
  set('o-kwh',kwh.toFixed(2)+' kWh/日');set('o-cd',(kwh*c).toFixed(1)+' 円');set('o-cm',Math.round(kwh*c*30)+' 円');set('o-cc',Math.round(kwh*c*n)+' 円');
  const molDay=dli*A;set('o-cmol',molDay>0?(kwh*c/molDay).toFixed(1)+' 円':'–');
  const UA=U*6*(cs/100)**2,VA=1200*v/60000,dT=W/(UA+VA);
  const el=$('#o-dt');el.textContent='+'+dT.toFixed(1)+' ℃';el.className='v'+(dT>5?' warn':'');
  set('o-ua',UA.toFixed(1)+' / '+VA.toFixed(1));
  CP={p,s,d,R,W,dT,v,cs,f,ppf};
}
const PRE={open:{cr:0,cv:0},good:{cr:70,cv:100},strong:{cp:1000,ch:12},weak:{cp:200,ch:16}};
document.querySelectorAll('[data-pre]').forEach(b=>b.addEventListener('click',()=>{const p=PRE[b.dataset.pre];for(const k in p)$('#'+k).value=p[k];calc()}));
document.querySelectorAll('#calcbox input,#calcbox select').forEach(x=>x.addEventListener('input',calc));
let CP=null,parts=[],fanA=0,lastT=0,spawnAcc=0,hitAcc=[0,0];
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function anim(t){
  const cv=document.getElementById('anim');
  if(cv&&CP&&cv.getContext){
    const ctx=cv.getContext('2d');
    if(ctx){
      const dpr=window.devicePixelRatio||1,Wd=cv.clientWidth,Hd=cv.clientHeight;
      if(cv.width!==Math.round(Wd*dpr)){cv.width=Math.round(Wd*dpr);cv.height=Math.round(Hd*dpr)}
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const dt=Math.min(0.05,lastT?(t-lastT)/1000:0.016);lastT=t;
      const cs=getComputedStyle(document.documentElement);
      const tx=cs.getPropertyValue('--tx').trim()||'#1f1e1d',sub=cs.getPropertyValue('--sub').trim()||'#5f5e5a';
      ctx.clearRect(0,0,Wd,Hd);
      const top=28,floor=Hd-34,sc=Math.min((floor-top)/(Math.max(CP.cs,CP.d)*1.1),(Wd-90)/Math.max(CP.cs,CP.s)),cx=Wd/2;
      const chW=Math.min(Wd-90,CP.cs*sc),chH=CP.cs*sc,chL=cx-chW/2,chR=cx+chW/2,chT=floor-chH;
      const aW=Math.min(chW,CP.s*sc),aL=cx-aW/2,aR=cx+aW/2;
      const ly=floor-CP.d*sc;
      const heat=Math.min(1,CP.dT/20);
      ctx.fillStyle='rgba(239,159,39,'+(0.06+heat*0.35)+')';ctx.fillRect(chL,chT,chW,chH);
      ctx.lineWidth=CP.R>0?1+CP.R/30:1;ctx.strokeStyle=CP.R>0?'rgba(136,135,128,'+(0.4+CP.R/150)+')':sub;
      ctx.setLineDash(CP.R>0?[]:[4,3]);ctx.strokeRect(chL,chT,chW,chH);ctx.setLineDash([]);
      ctx.fillStyle='#97C459';ctx.fillRect(aL,floor-6,aW,6);
      for(let i=0;i<3;i++){const x=cx+(i-1)*Math.min(14,aW/4);ctx.strokeStyle='#3B6D11';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,floor-6);ctx.lineTo(x+(i-1)*4,floor-6-Math.min(26,CP.d*sc*0.5));ctx.stroke()}
      const glow=Math.min(1,CP.W/40);
      ctx.fillStyle='rgba(250,199,117,'+(0.25+glow*0.5)+')';ctx.beginPath();ctx.ellipse(cx,ly+4,34,10+glow*8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#EF9F27';ctx.fillRect(cx-22,ly-6,44,8);
      const fx=chL+12,fy=chT+16,fr=9;
      if(CP.v>0){fanA+=dt*(2+CP.v/15);}
      ctx.strokeStyle=sub;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(fx,fy,fr+2,0,Math.PI*2);ctx.stroke();
      for(let k=0;k<3;k++){const a=fanA+k*2.094;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(a)*fr,fy+Math.sin(a)*fr);ctx.stroke()}
      if(CP.v>0){ctx.strokeStyle='rgba(55,138,221,0.5)';for(let k=0;k<3;k++){const o=((t/1000*(0.5+CP.v/100))+k/3)%1;const x=fx+14+o*Math.min(80,chW-40);ctx.beginPath();ctx.moveTo(x,fy-4+k*4);ctx.lineTo(x+12,fy-4+k*4);ctx.stroke()}}
      const rate=RM?0:Math.min(260,CP.ppf*0.9+10);
      spawnAcc+=rate*dt;
      while(spawnAcc>=1&&parts.length<500){spawnAcc-=1;const sn=Math.sqrt(Math.random())*(Math.random()<0.5?-1:1);const cs2=Math.sqrt(1-sn*sn);const sp=170;parts.push({x:cx+(Math.random()-0.5)*40,y:ly+2,vx:sn*sp,vy:cs2*sp,life:3,hit:0})}
      if(RM){parts=[];ctx.strokeStyle='rgba(239,159,39,0.5)';for(let k=-6;k<=6;k++){const sn=k/7;const c2=Math.sqrt(1-sn*sn);const L=(floor-ly)/c2;ctx.beginPath();ctx.moveTo(cx,ly);ctx.lineTo(cx+sn*L,floor);ctx.stroke()}}
      const inside=x=>CP.d<=CP.cs&&x>chL&&x<chR;
      for(const q of parts){
        if(q.hit>0){q.hit-=dt;if(q.hit<=0)q.life=0;continue}
        q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
        if(CP.d<=CP.cs&&q.y>chT){
          if(q.x<chL||q.x>chR){if(Math.random()<CP.R/100){q.vx=-q.vx;q.x=q.x<chL?chL+1:chR-1}else q.life=0}
        }
        if(q.y<chT&&CP.d<=CP.cs&&q.vy<0){if(Math.random()<CP.R/100){q.vy=-q.vy;q.y=chT+1}else q.life=0}
        if(q.y>=floor-6){
          if(q.x>=aL&&q.x<=aR){q.hit=0.25;q.y=floor-7;hitAcc[0]++}
          else if(inside(q.x)&&Math.random()<CP.R/100*0.5){q.vy=-q.vy;q.y=floor-7}
          else q.life=0;
          hitAcc[1]++;
        }
        if(q.y>Hd||q.x<0||q.x>Wd||q.y<0)q.life=0;
      }
      parts=parts.filter(q=>q.life>0&&!(q.hit<0));
      for(const q of parts){ctx.fillStyle=q.hit>0?'#639922':'#EF9F27';ctx.beginPath();ctx.arc(q.x,q.y,q.hit>0?2.6:2,0,Math.PI*2);ctx.fill()}
      const thx=Wd-26,thT=top,thB=floor-6;
      ctx.strokeStyle=sub;ctx.lineWidth=1;ctx.strokeRect(thx-4,thT,8,thB-thT);
      const lvl=(thB-thT)*Math.min(1,0.15+heat*0.85);
      ctx.fillStyle=CP.dT>5?'#E24B4A':'#EF9F27';ctx.fillRect(thx-3,thB-lvl,6,lvl);
      ctx.beginPath();ctx.arc(thx,thB+6,7,0,Math.PI*2);ctx.fill();
      ctx.font='12px system-ui,sans-serif';ctx.fillStyle=tx;ctx.textAlign='right';
      ctx.fillText('+'+CP.dT.toFixed(1)+' ℃',thx-10,thT+10);
      ctx.textAlign='left';ctx.fillText('LED '+CP.W.toFixed(0)+' W',cx+28,ly);
      ctx.fillStyle=sub;
      ctx.fillText('距離 '+CP.d+' cm',8,Hd-12);
      ctx.textAlign='center';ctx.fillText('届く割合 '+Math.round(CP.f*100)+' %',cx,Hd-12);
      if(CP.d>CP.cs){ctx.fillStyle='#E24B4A';ctx.textAlign='left';ctx.fillText('LEDが温室の外',8,16)}
      if(CP.v>0){ctx.fillStyle=sub;ctx.textAlign='left';ctx.fillText('換気',fx-8,fy+26)}
    }
  }
  requestAnimationFrame(anim);
}
calc();
requestAnimationFrame(anim);
</script>
</body></html>
